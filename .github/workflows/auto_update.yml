import json
import random
import urllib.request
import urllib.parse
import os

new_code = str(random.randint(100000, 999999))
data = {
    "valid_code": new_code
}

with open('activation.json', 'w') as f:
    json.dump(data, f, indent=4)

print(f"Successfully updated activation code to: {new_code}")

bot_token = os.environ.get("TELEGRAM_TOKEN")
chat_id = os.environ.get("TELEGRAM_CHAT_ID")

if bot_token and chat_id:
    message = f"🚨 ZoneStream Security Update:\n\nThe Activation Code has been automatically changed!\n\n🔑 New Code: {new_code}"
    url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
    payload = urllib.parse.urlencode({'chat_id': chat_id, 'text': message}).encode('utf-8')
    
    try:
        req = urllib.request.Request(url, data=payload, method='POST')
        urllib.request.urlopen(req)
        print("Telegram message sent successfully.")
    except Exception as e:
        print(f"Failed to send Telegram message: {e}")
else:
    print("Telegram credentials not found in secrets.")
